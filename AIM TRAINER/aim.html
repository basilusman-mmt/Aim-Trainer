
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aim Trainer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .target-animate {
      animation: popIn 0.12s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans transition-colors duration-300">
  <header class="w-full max-w-5xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-slate-300 dark:border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-rose-500 flex items-center justify-center text-white font-bold shadow-md shadow-rose-500/30">+</div>
      <h1 class="text-xl font-bold tracking-tight">AimLab<span class="text-rose-500">Lite</span></h1>
    </div>

    <div class="flex items-center gap-6 text-sm font-medium bg-white dark:bg-slate-900 px-5 py-2.5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800">
      <div class="flex flex-col items-center">
        <span class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider">Time</span>
        <span id="time-display" class="text-lg font-bold">30s</span>
      </div>
      <div class="h-6 w-px bg-slate-200 dark:bg-slate-800"></div>
      <div class="flex flex-col items-center">
        <span class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider">Score</span>
        <span id="score-display" class="text-lg font-bold text-rose-500">0</span>
      </div>
      <div class="h-6 w-px bg-slate-200 dark:bg-slate-800"></div>
      <div class="flex flex-col items-center">
        <span class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider">Accuracy</span>
        <span id="accuracy-display" class="text-lg font-bold text-emerald-500">100%</span>
      </div>
    </div>

    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm">
      <svg class="w-5 h-5 text-amber-400 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
      <svg class="w-5 h-5 text-slate-700 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto p-4 sm:p-6 flex flex-col">
    <div id="arena" class="relative flex-1 w-full min-h-[450px] bg-white dark:bg-slate-900 rounded-2xl border-2 border-slate-200 dark:border-slate-800 shadow-inner overflow-hidden cursor-crosshair transition-colors duration-300">
      <div id="overlay" class="absolute inset-0 bg-slate-100/80 dark:bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10 transition-opacity duration-200">
        <h2 id="overlay-title" class="text-2xl sm:text-3xl font-extrabold mb-2">Ready to Test Your Reflexes?</h2>
        <p id="overlay-subtitle" class="text-slate-600 dark:text-slate-400 max-w-md mb-6">Click the targets as fast as possible before the 30-second timer runs out. Missed clicks lower your accuracy.</p>

        <div id="results-box" class="hidden grid-cols-3 gap-4 mb-6 bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm w-full max-w-sm">
          <div>
            <p class="text-xs text-slate-500 uppercase">Hits</p>
            <p id="final-score" class="text-2xl font-bold text-rose-500">0</p>
          </div>
          <div>
            <p class="text-xs text-slate-500 uppercase">Accuracy</p>
            <p id="final-accuracy" class="text-2xl font-bold text-emerald-500">0%</p>
          </div>
          <div>
            <p class="text-xs text-slate-500 uppercase">Clicks/Sec</p>
            <p id="final-cps" class="text-2xl font-bold text-sky-500">0.0</p>
          </div>
        </div>

        <div class="flex items-center gap-2 mb-6 bg-slate-200/70 dark:bg-slate-800/70 p-1.5 rounded-xl">
          <button type="button" data-size="56" class="diff-btn px-4 py-1.5 rounded-lg text-sm font-semibold transition-all bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white">Easy</button>
          <button type="button" data-size="40" class="diff-btn px-4 py-1.5 rounded-lg text-sm font-semibold transition-all text-slate-600 dark:text-slate-400">Medium</button>
          <button type="button" data-size="26" class="diff-btn px-4 py-1.5 rounded-lg text-sm font-semibold transition-all text-slate-600 dark:text-slate-400">Hard</button>
        </div>

        <button id="start-btn" type="button" class="px-8 py-3.5 rounded-xl bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold text-lg shadow-lg shadow-rose-500/30 transition-all cursor-pointer">Start Training</button>
      </div>
    </div>
  </main>

  <script>
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('theme-toggle');
    const arena = document.getElementById('arena');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const resultsBox = document.getElementById('results-box');
    const startBtn = document.getElementById('start-btn');
    const diffBtns = document.querySelectorAll('.diff-btn');
    const timeDisplay = document.getElementById('time-display');
    const scoreDisplay = document.getElementById('score-display');
    const accuracyDisplay = document.getElementById('accuracy-display');
    const finalScore = document.getElementById('final-score');
    const finalAccuracy = document.getElementById('final-accuracy');
    const finalCps = document.getElementById('final-cps');

    const GAME_DURATION = 30;
    let timeLeft = GAME_DURATION;
    let score = 0;
    let totalClicks = 0;
    let targetSize = 56;
    let isPlaying = false;
    let timerInterval = null;
    let currentTarget = null;

    themeToggle.addEventListener('click', () => {
      htmlEl.classList.toggle('dark');
    });

    diffBtns.forEach((btn) => {
      btn.addEventListener('click', (event) => {
        event.stopPropagation();
        if (isPlaying) return;

        diffBtns.forEach((button) => {
          button.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900', 'dark:text-white');
          button.classList.add('text-slate-600', 'dark:text-slate-400');
        });

        btn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900', 'dark:text-white');
        btn.classList.remove('text-slate-600', 'dark:text-slate-400');
        targetSize = Number(btn.dataset.size);
      });
    });

    startBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      startGame();
    });

    function startGame() {
      clearInterval(timerInterval);
      score = 0;
      totalClicks = 0;
      timeLeft = GAME_DURATION;
      isPlaying = true;
      timeDisplay.textContent = `${timeLeft}s`;
      updateStats();
      overlay.classList.add('hidden');
      resultsBox.classList.add('hidden');
      resultsBox.classList.remove('grid');
      overlayTitle.textContent = 'Ready to Test Your Reflexes?';
      overlaySubtitle.textContent = 'Click the targets as fast as possible before the 30-second timer runs out. Missed clicks lower your accuracy.';
      startBtn.textContent = 'Start Training';
      spawnTarget();

      timerInterval = setInterval(() => {
        timeLeft -= 1;
        timeDisplay.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);

      if (currentTarget) {
        currentTarget.remove();
        currentTarget = null;
      }

      const accuracy = totalClicks === 0 ? 100 : Math.round((score / totalClicks) * 100);
      const cps = (score / GAME_DURATION).toFixed(1);

      overlayTitle.textContent = 'Session Complete!';
      overlaySubtitle.textContent = 'Check your stats below or adjust difficulty for another round.';
      finalScore.textContent = score;
      finalAccuracy.textContent = `${accuracy}%`;
      finalCps.textContent = cps;
      resultsBox.classList.remove('hidden');
      resultsBox.classList.add('grid');
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function spawnTarget() {
      if (!isPlaying) return;

      if (currentTarget) currentTarget.remove();

      const target = document.createElement('button');
      target.type = 'button';
      target.setAttribute('aria-label', 'Target');
      target.style.width = `${targetSize}px`;
      target.style.height = `${targetSize}px`;

      const radius = targetSize / 2;
      const maxX = Math.max(radius, arena.clientWidth - radius);
      const maxY = Math.max(radius, arena.clientHeight - radius);
      const randomX = radius + Math.random() * Math.max(0, maxX - radius);
      const randomY = radius + Math.random() * Math.max(0, maxY - radius);

      target.style.left = `${randomX}px`;
      target.style.top = `${randomY}px`;
      target.className = 'absolute rounded-full bg-rose-500 hover:bg-rose-400 border-4 border-white dark:border-slate-900 ring-2 ring-rose-500 shadow-lg cursor-crosshair target-animate flex items-center justify-center focus:outline-none';

      const innerDot = document.createElement('span');
      innerDot.className = 'w-1/3 h-1/3 rounded-full bg-white pointer-events-none';
      target.appendChild(innerDot);

      target.addEventListener('pointerdown', (event) => {
        event.stopPropagation();
        if (!isPlaying) return;
        score += 1;
        totalClicks += 1;
        updateStats();
        spawnTarget();
      });

      arena.appendChild(target);
      currentTarget = target;
    }

    arena.addEventListener('pointerdown', (event) => {
      if (!isPlaying || event.target === currentTarget) return;
      totalClicks += 1;
      updateStats();
    });

    function updateStats() {
      scoreDisplay.textContent = score;
      const accuracy = totalClicks === 0 ? 100 : Math.round((score / totalClicks) * 100);
      accuracyDisplay.textContent = `${accuracy}%`;
    }
  </script>
</body>
</html>
